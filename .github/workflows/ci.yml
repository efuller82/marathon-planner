# PLACEHOLDER — replaced during bootstrap (see BOOTSTRAP.md, Phase 3 step 4)
# with the project's real gate: lint, typecheck, test, build for the chosen
# stack. Keep the bootstrap-guard job; it blocks PRs until initialization
# is complete. Pin any external actions to commit SHAs.

name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-guard:
    name: Bootstrap must be complete
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail if the project is not initialized
        run: |
          if [ -f BOOTSTRAP.md ]; then
            echo "BOOTSTRAP.md still exists: this project has not been initialized." >&2
            echo "Run the bootstrap session before opening pull requests." >&2
            exit 1
          fi
          if grep -rn '{{' AGENTS.md SECURITY.md; then
            echo "Unfilled {{placeholders}} remain — bootstrap is incomplete." >&2
            exit 1
          fi

  gate:
    name: Project gate (not configured)
    runs-on: ubuntu-latest
    needs: bootstrap-guard
    steps:
      - name: Placeholder
        run: |
          echo "::warning::CI is not configured. Replace this job with the real gate during bootstrap."

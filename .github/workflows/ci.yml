name: Pull request checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-guard:
    name: Bootstrap must be complete
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm initialization
        shell: bash
        run: |
          test ! -f BOOTSTRAP.md
          ! grep -rn '{{' AGENTS.md SECURITY.md

  gate:
    name: Project gate
    runs-on: ubuntu-latest
    needs: bootstrap-guard
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile application and tests
        run: python -m compileall -q src tests run.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
